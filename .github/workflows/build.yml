# dw2-pc-port: builds the game program for Windows x64 and Linux x64 WITHOUT any game data
# (tools/build_native.py --no-disc). The program loads the disc tables at start from the
# player's own disc image (host/discassets.c). Nothing from the game is checked out, downloaded
# or packaged here.
name: Build

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
    paths-ignore: ["**.md", "doc/**"]
  workflow_dispatch:
    inputs:
      release:
        description: "release tag to publish (e.g. v1.1.0); empty = test build"
        required: false
        default: ""

permissions:
  contents: write

env:
  SDL_VERSION: 3.4.8

jobs:
  windows-x64:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: false
          install: mingw-w64-x86_64-gcc

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ninja and SDL3 (MinGW development release)
        shell: pwsh
        run: |
          python -m pip install ninja
          $url = "https://github.com/libsdl-org/SDL/releases/download/release-$env:SDL_VERSION/SDL3-devel-$env:SDL_VERSION-mingw.tar.gz"
          Invoke-WebRequest $url -OutFile sdl3.tar.gz
          tar -xzf sdl3.tar.gz
          "DW2_SDL3=$((Resolve-Path "SDL3-$env:SDL_VERSION").Path)" | Out-File $env:GITHUB_ENV -Append
          "DW2_MINGW=${{ steps.msys2.outputs.msys2-location }}\mingw64" | Out-File $env:GITHUB_ENV -Append

      - name: Build (release, no disc data)
        shell: pwsh
        run: python tools/build_native.py --arch x64 --release --no-disc

      - name: Font tests (no game data)
        shell: pwsh
        run: |
          & build/native64_rel_nodisc/fonts_test.exe
          if ($LASTEXITCODE -ne 0) { throw "fonts_test failed ($LASTEXITCODE)" }

      # Real Windows checks without game data: the Vulkan GPU renderer on Mesa lavapipe for
      # Windows (software Vulkan), the software renderer, and the import's refusal paths.
      - name: Vulkan for the test (Mesa lavapipe + loader)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          & "${{ steps.msys2.outputs.msys2-location }}\usr\bin\pacman.exe" -S --noconfirm --needed mingw-w64-x86_64-vulkan-loader
          gh release download -R pal1000/mesa-dist-win --pattern "*release-msvc.7z" -O mesa.7z
          7z x mesa.7z -omesa | Out-Null
          $icd = Get-ChildItem mesa/x64 -Filter "lvp_icd*.json" | Select-Object -First 1
          if ($null -eq $icd) { Get-ChildItem -Recurse mesa | Select-Object -First 40 FullName; throw "no lavapipe ICD" }
          # the loader ignores VK_DRIVER_FILES when elevated (as on the runner): register the ICD
          # the way a driver installer does
          New-Item -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Force | Out-Null
          New-ItemProperty -Path "HKLM:\SOFTWARE\Khronos\Vulkan\Drivers" -Name $icd.FullName -Value 0 -PropertyType DWord -Force | Out-Null
          "VK_DRIVER_FILES=$($icd.FullName)" | Out-File $env:GITHUB_ENV -Append
          "VK_ICD_FILENAMES=$($icd.FullName)" | Out-File $env:GITHUB_ENV -Append
          $vk = Get-ChildItem "$env:DW2_MINGW\bin" -Filter "*vulkan*.dll" | Select-Object -First 1
          if ($null -eq $vk) { throw "no Vulkan loader DLL in $env:DW2_MINGW\bin" }
          "Vulkan loader: $($vk.Name)"
          Copy-Item $vk.FullName build/native64_rel_nodisc/vulkan-1.dll

      - name: Windows renderer test (software vs GPU/Vulkan, synthetic scene)
        shell: pwsh
        env:
          VK_LOADER_DEBUG: error,warn
          SDL_LOGGING: "gpu=debug"
        run: |
          Get-Content $env:VK_DRIVER_FILES
          Get-ChildItem (Split-Path $env:VK_DRIVER_FILES) | Select-Object -First 20 Name
          New-Item -ItemType Directory -Force hd_test_win | Out-Null
          & build/native64_rel_nodisc/hd_test.exe --out hd_test_win --require-gpu
          if ($LASTEXITCODE -ne 0) { throw "hd_test failed ($LASTEXITCODE)" }

      - name: Windows import checks (no pack, wrong image)
        shell: pwsh
        run: |
          $b = "build/native64_rel_nodisc"
          $o = & "$b/dw2.exe" --no-window --no-update-check --pak missing.pak 2>&1 | Out-String
          $o
          if ($LASTEXITCODE -ne 1 -or $o -notmatch "builds its data pack") { throw "missing pack not refused cleanly" }
          [IO.File]::WriteAllBytes("$PWD\fake.bin", (New-Object byte[] (2352 * 400)))
          Set-Content fake.cue "FILE `"fake.bin`" BINARY`r`n  TRACK 01 MODE2/2352`r`n    INDEX 01 00:00:00" -Encoding ascii
          $o = & "$b/dw2.exe" --no-window --no-update-check --pak fake.pak --disc fake.cue 2>&1 | Out-String
          $o
          if ($LASTEXITCODE -ne 1) { throw "wrong image not refused" }
          if (Test-Path fake.pak) { throw "a pack was written from a wrong image" }
          "import checks passed"
          exit 0

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hd-test-pictures-windows
          path: hd_test_win

      - name: Package
        shell: pwsh
        run: |
          $b = "build/native64_rel_nodisc"
          & "$b/dw2.exe" --version
          $pkg = "DW2-PC-Port/DW2-PC"
          New-Item -ItemType Directory -Force $pkg | Out-Null
          Copy-Item "$b/dw2.exe", "$b/SDL3.dll" $pkg
          # MinGW runtime DLLs the exe imports (none expected: libgcc/libstdc++ are static)
          $objdump = "$env:DW2_MINGW\bin\objdump.exe"
          $dlls = & $objdump -p "$b/dw2.exe" | Select-String "DLL Name: (.+)" | ForEach-Object { $_.Matches[0].Groups[1].Value.Trim() }
          "imports: $($dlls -join ', ')"
          foreach ($d in $dlls) {
            $p = Join-Path "$env:DW2_MINGW\bin" $d
            if (Test-Path $p) { Copy-Item $p $pkg; "bundled $d" }
          }
          Copy-Item LICENSE "$pkg/LICENSE.txt"
          New-Item -ItemType Directory -Force "$pkg/FontLicenses" | Out-Null
          Copy-Item misc/fonts/*-OFL.txt "$pkg/FontLicenses/"
          Copy-Item doc/FONTS.md "$pkg/FontLicenses/FONTS.md"
          Copy-Item README_PORT.md "$pkg/README_PORT.md"
          Copy-Item TESTBERICHT.md "$pkg/TESTBERICHT.md"
          Copy-Item -Recurse Languages "$pkg/Languages"
          # Windows test run for the player's PC (tools/wintest): renderer test + reference hashes
          New-Item -ItemType Directory -Force "$pkg/tests" | Out-Null
          Copy-Item "$b/hd_test.exe" "$pkg/tests/"
          Copy-Item tests/referenz_md5.txt "$pkg/tests/"
          Copy-Item tools/wintest/DW2-Test.bat, tools/wintest/DW2-Test.ps1 $pkg
          Compress-Archive -Path $pkg -DestinationPath DW2-PC-Port-windows-x64.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: DW2-PC-Port-windows-x64
          path: DW2-PC-Port-windows-x64.zip

  linux-x64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build cmake gcc g++ libx11-dev libxext-dev libxcursor-dev libxi-dev libxfixes-dev libxrandr-dev libxss-dev libxtst-dev libasound2-dev libpulse-dev libgl-dev libvulkan-dev

      - name: SDL3 from source
        run: |
          curl -sSL -o sdl.tar.gz https://github.com/libsdl-org/SDL/releases/download/release-$SDL_VERSION/SDL3-$SDL_VERSION.tar.gz
          tar -xzf sdl.tar.gz
          cmake -S SDL3-$SDL_VERSION -B sdlbuild -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=$PWD/sdl3inst -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF -DSDL_WAYLAND=OFF
          cmake --build sdlbuild
          cmake --install sdlbuild
          echo "CMAKE_PREFIX_PATH=$PWD/sdl3inst" >> $GITHUB_ENV

      - name: Build (release, no disc data)
        run: python3 tools/build_native.py --release --no-disc

      - name: Text/script layout test (made-up bytes, no game data)
        run: build/linux64_rel_nodisc/textscript_test

      - name: Font tests (no game data)
        run: build/linux64_rel_nodisc/fonts_test

      - name: Renderer test (software vs GPU on Mesa lavapipe, synthetic scene, no game data)
        run: |
          sudo apt-get install -y mesa-vulkan-drivers libvulkan1 vulkan-tools
          mkdir -p hd_test_out
          VK_ICD_FILENAMES=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json | head -1) \
            build/linux64_rel_nodisc/hd_test --out hd_test_out --require-gpu

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hd-test-pictures
          path: hd_test_out

      - name: Package
        run: |
          b=build/linux64_rel_nodisc
          $b/dw2 --version
          mkdir -p DW2-PC-Port/DW2-PC
          cp $b/dw2 DW2-PC-Port/DW2-PC/
          cp -L sdl3inst/lib/libSDL3.so.0 DW2-PC-Port/DW2-PC/
          cp LICENSE DW2-PC-Port/DW2-PC/LICENSE.txt
          mkdir -p DW2-PC-Port/DW2-PC/FontLicenses
          cp misc/fonts/*-OFL.txt doc/FONTS.md DW2-PC-Port/DW2-PC/FontLicenses/
          cp README_PORT.md TESTBERICHT.md DW2-PC-Port/DW2-PC/
          cp -r Languages DW2-PC-Port/DW2-PC/
          (cd DW2-PC-Port && zip -r ../DW2-PC-Port-linux-x64.zip DW2-PC)

      - uses: actions/upload-artifact@v4
        with:
          name: DW2-PC-Port-linux-x64
          path: DW2-PC-Port-linux-x64.zip

  release:
    if: github.event_name != 'pull_request'
    needs: [windows-x64, linux-x64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish test build (main) or the release (tag v*)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${{ github.event.inputs.release }}"
          NOTES="Windows- und Linux-Version ohne Spieldaten: beim ersten Start wird dein eigenes Digimon World 2 (USA) Image importiert. Anleitung: README_PORT.md, Testbericht: TESTBERICHT.md (was getestet ist und was nicht). Vorabversion, weil Grafik, Ton und Controller auf echter Windows-Hardware noch nicht geprüft sind."
          if [ -n "$TAG" ]; then
            ok=0
            for try in 1 2 3 4; do
              # an earlier try may have left the release (as a draft): finish that one
              if gh release view "$TAG" >/dev/null 2>&1; then
                gh release upload "$TAG" DW2-PC-Port-windows-x64.zip DW2-PC-Port-linux-x64.zip --clobber &&
                gh release edit "$TAG" --draft=false --prerelease --title "DW2 PC-Port $TAG" --notes "$NOTES" && ok=1
              else
                gh release create "$TAG" DW2-PC-Port-windows-x64.zip DW2-PC-Port-linux-x64.zip \
                  --prerelease --target "${{ github.sha }}" --title "DW2 PC-Port $TAG" --notes "$NOTES" && ok=1
              fi
              [ "$ok" = 1 ] && break
              echo "try $try failed, waiting"; sleep 45
            done
            [ "$ok" = 1 ]
          else
            gh release delete test-build --yes --cleanup-tag || true
            gh release create test-build DW2-PC-Port-windows-x64.zip DW2-PC-Port-linux-x64.zip \
              --prerelease --target "${{ github.sha }}" --title "Test-Build (${GITHUB_SHA::7})" \
              --notes "Automatischer Test-Build ohne Spieldaten. Beim ersten Start braucht das Programm dein eigenes Digimon World 2 (USA) Image (.cue/.bin). Siehe README_PORT.md."
          fi
